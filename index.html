<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modo Foco Total · Meu painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Josefin+Sans:wght@200&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fcf4f7; --card:#ffffff; --ink:#4a1d63; --muted:#9b7fae;
  --pink:#e0247a; --pink2:#f24d8f; --rose:#fbd9e7; --rose2:#fdeef4;
  --lilac:#c89af0; --lilac2:#f1e6fb; --line:#f3dbe6;
  --cm:#e0247a; --cc:#f2707a; --ca:#b23ad1; --cw:#9d6ff0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);font-family:Poppins,system-ui,sans-serif;color:var(--ink);min-height:100vh}
.wrap{max-width:1280px;margin:0 auto;padding:30px 40px 40px}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.brand .script{font-family:"Great Vibes",cursive;font-size:44px;color:#8a2fb0;margin-left:6px;margin-bottom:4px}
.brand .total{display:flex;align-items:center;gap:14px}
.brand .total span{font-family:"Josefin Sans",sans-serif;font-weight:200;font-size:64px;letter-spacing:.06em;
  background:linear-gradient(90deg,#e0247a,#f2707a);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .total i{display:block;width:46px;height:3px;background:var(--pink);border-radius:2px}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.pill{background:var(--rose);color:var(--pink);font-weight:700;font-size:15px;padding:9px 22px;border-radius:999px}
.pill b{color:var(--ink);font-weight:600}
.progress-wrap{width:330px;max-width:100%}
.progress-wrap .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.progress-wrap .lbl strong{color:var(--ink)}
.bar{height:10px;background:var(--lilac2);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--lilac),var(--pink2));border-radius:99px;transition:width .4s}
.status{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:#cbb8d8;display:inline-block}
.status.ok i{background:#4cc38a}.status.busy i{background:#f2a33a}.status.warn i{background:#e0247a}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:22px}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px 22px;position:relative;overflow:hidden;min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:500;letter-spacing:.02em;padding-right:44px}
.kpi .v{font-size:34px;font-weight:700;color:var(--ink);margin-top:2px;line-height:1.15;white-space:nowrap}
.kpi .v small{font-size:15px;font-weight:500;color:var(--muted);margin-left:4px}
.kpi .s{font-size:12px;color:var(--pink);font-weight:600;margin-top:2px}
.kpi.hl{background:linear-gradient(135deg,#e0247a,#b23ad1);border:none}
.kpi.hl .k,.kpi.hl .s{color:#ffe3f0}.kpi.hl .v,.kpi.hl .v small{color:#fff}
.kpi .ico{position:absolute;right:18px;top:18px;width:38px;height:38px;border-radius:12px;background:var(--rose2);display:grid;place-items:center}
.kpi.hl .ico{background:rgba(255,255,255,.18)}

/* layout */
.main{display:grid;grid-template-columns:470px 1fr;gap:22px;margin-bottom:22px;align-items:start}
.bottom{display:grid;grid-template-columns:1fr 470px;gap:22px;align-items:start}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:22px 24px;min-width:0}
.card h3{font-size:17px;font-weight:700;color:var(--pink);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h3 .sub{font-size:12px;color:var(--muted);font-weight:500;text-align:right}

/* check-in */
.daynav{display:flex;align-items:center;justify-content:space-between;background:var(--rose2);border-radius:16px;padding:10px 14px;margin:14px 0 6px}
.daynav button{width:36px;height:36px;border-radius:11px;border:1.5px solid var(--line);background:#fff;color:var(--pink);font-size:18px;font-weight:700;display:grid;place-items:center}
.daynav button:disabled{opacity:.35;cursor:default}
.daynav .d{text-align:center}.daynav .d b{display:block;font-size:16px}.daynav .d span{font-size:11.5px;color:var(--muted)}
.item{display:flex;gap:14px;padding:15px 2px;border-bottom:1px solid var(--line)}
.chk{width:32px;height:32px;border-radius:10px;border:2px solid var(--lilac);background:#fff;flex:none;display:grid;place-items:center;margin-top:1px;transition:background .15s,border-color .15s}
.chk svg{opacity:0;transition:opacity .15s}
.chk.on{background:var(--pink);border-color:var(--pink)}.chk.on svg{opacity:1}
.chk:focus-visible{outline:3px solid rgba(224,36,122,.3);outline-offset:2px}
.it-body{flex:1;min-width:0}
.it-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px}
.it-name{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:600;flex-wrap:wrap}
.it-name svg{flex:none}
.it-name em{font-style:normal;font-size:12px;color:var(--muted);font-weight:400}
.pts{font-size:13px;font-weight:700;color:var(--pink);background:var(--rose2);padding:4px 11px;border-radius:99px;white-space:nowrap}
.pts.zero{color:var(--muted);background:#f6f1f8}
.fields{display:flex;gap:10px;margin-top:10px}
.field{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;background:#fffafc;min-width:0;transition:border-color .15s}
.field:focus-within{border-color:var(--pink2)}
.field label{display:block;font-size:10.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field input{width:100%;border:none;background:transparent;font-size:16px;font-weight:600;color:var(--ink);outline:none;padding:1px 0}
.field input::placeholder{color:#d5c4df;font-weight:500}
.fields.dim{opacity:.55}
.quick{display:flex;gap:6px;align-items:stretch}
.quick button{border:none;background:var(--lilac2);color:#8a2fb0;font-weight:700;font-size:12.5px;border-radius:12px;padding:0 12px;min-width:52px}
.quick button:active{transform:scale(.96)}
.hint{font-size:11.5px;color:var(--muted);margin-top:7px}
.wbar{height:8px;background:var(--lilac2);border-radius:99px;margin-top:9px;overflow:hidden}
.wbar>div{height:100%;background:var(--cw);border-radius:99px;transition:width .3s}
.obs{margin-top:6px;border-top:1px solid var(--line);padding-top:14px}
.obs label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:8px}
.obs label em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:400}
.obs textarea{width:100%;min-height:76px;resize:vertical;border:1.5px solid var(--line);border-radius:12px;background:#fffafc;padding:10px 12px;font-family:inherit;font-size:14px;color:var(--ink);line-height:1.5;outline:none}
.obs textarea:focus{border-color:var(--pink2)}
.obs textarea::placeholder{color:#cbb6d8}
.cell .note{position:absolute;bottom:8px;right:8px;opacity:.8}
.daytotal{margin-top:12px;background:linear-gradient(90deg,var(--rose),var(--lilac2));border-radius:16px;padding:13px 18px;display:flex;justify-content:space-between;align-items:center}
.daytotal span{font-size:13.5px;font-weight:600}
.daytotal b{font-size:24px;color:var(--pink)}

/* calendar */
.cal-head,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}
.cal-head{margin:16px 0 8px}
.cal-head div{text-align:center;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.05em}
.cell{height:84px;border-radius:16px;padding:9px 10px;position:relative;border:1.5px solid transparent;display:flex;flex-direction:column;justify-content:space-between;text-align:left;font-family:inherit;color:var(--ink);background:none;min-width:0}
button.cell:hover{filter:brightness(.97)}
.cell .n{font-size:12px;font-weight:600;opacity:.75}
.cell .p{font-size:18px;font-weight:700;line-height:1;white-space:nowrap}
.cell .p small{font-size:10px;font-weight:500;opacity:.7;margin-left:2px}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(150,120,170,.18)}
.dots i.m.on{background:var(--cm)}.dots i.c.on{background:var(--cc)}.dots i.a.on{background:var(--ca)}.dots i.w.on{background:var(--cw)}
.cell.dark .dots i:not(.on){background:rgba(255,255,255,.45)}
.cell.dark{color:#fff}.cell.dark .n{opacity:.95}
.cell.future{background:#faf6fb;border:1.5px dashed #eadff0;cursor:default}
.cell.future .n{opacity:.45}
.cell.sel{border-color:var(--pink);box-shadow:0 0 0 3px rgba(224,36,122,.14)}
.cell .tag{position:absolute;top:8px;right:8px;font-size:9px;font-weight:700;color:var(--pink);background:#fff;border-radius:99px;padding:1px 6px}
.legend{display:flex;gap:16px;margin-top:14px;font-size:11.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.scale{display:flex;align-items:center;gap:4px;margin-left:auto}
.scale b{width:18px;height:12px;border-radius:4px;display:inline-block}

/* chart */
.chart-wrap{position:relative;margin-top:26px;padding-left:22px}
.chart{height:250px;display:flex;align-items:flex-end;gap:5px;position:relative;border-bottom:1.5px solid var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;min-width:0}
.chart .stack{width:100%;max-width:24px;display:flex;flex-direction:column-reverse;border-radius:7px 7px 3px 3px;overflow:hidden;transition:height .3s}
.chart .col.sel .stack{outline:2px solid var(--pink);outline-offset:2px}
.chart .val{font-size:9.5px;font-weight:600;margin-bottom:3px;white-space:nowrap}
.chart .xl{position:absolute;bottom:-19px;font-size:9.5px;color:var(--muted);white-space:nowrap}
.chart .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--lilac);font-size:10px;color:#8a2fb0;pointer-events:none;z-index:1}
.chart .goal span{position:absolute;right:0;top:-17px;background:#fff;padding:0 4px}
.ylab{position:absolute;left:0;font-size:10px;color:var(--muted);transform:translateY(50%)}
.chart-foot{height:24px}

/* summary */
.cats .row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cats .row:last-child{border-bottom:none}
.cats .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.cats .t{font-size:14px;font-weight:600}
.cats .t small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
.cats .mini{height:6px;background:#f3ecf7;border-radius:99px;margin-top:6px;overflow:hidden}
.cats .mini div{height:100%;border-radius:99px;transition:width .3s}
.cats .r{text-align:right;font-size:18px;font-weight:700;white-space:nowrap}
.cats .r small{display:block;font-size:10.5px;font-weight:500;color:var(--muted)}

.rules{margin-top:22px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.7}
.rules b{color:var(--ink);font-weight:600}

/* responsive */
@media (max-width:1100px){
  .main,.bottom{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .cell .note{bottom:5px;right:5px}.cell .note svg{width:9px;height:9px}
  .wrap{padding:18px 14px 30px}
  header{flex-direction:column;align-items:stretch;gap:14px;margin-bottom:18px}
  .brand{align-items:center}
  .brand .script{font-size:36px;margin:0 0 2px}
  .brand .total span{font-size:48px}
  .brand .total i{width:30px}
  .hdr-right{align-items:stretch}
  .pill{text-align:center;font-size:14px}
  .progress-wrap{width:100%}
  .status{justify-content:center}
  .kpis{gap:10px;margin-bottom:16px}
  .kpi{padding:14px 14px;border-radius:18px}
  .kpi .k{font-size:10.5px;padding-right:30px}
  .kpi .v{font-size:25px}.kpi .v small{font-size:12px}
  .
